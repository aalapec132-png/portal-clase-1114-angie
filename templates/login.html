
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Portal Clase 1114</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
        }

        .navbar {
            background-color: #667eea;
        }

        .navbar-brand {
            font-weight: bold;
            font-size: 1.5rem;
        }

        .hero {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 60px 0;
            margin-bottom: 40px;
        }

        .card {
            border: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .footer {
            background-color: #343a40;
            color: white;
            padding: 20px 0;
            margin-top: 40px;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Clase 1114</a>

            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="/informacion">Informacion</a></li>
                    <li class="nav-item"><a class="nav-link" href="/recursos">Recursos</a></li>
                    <li class="nav-item"><a class="nav-link" href="/login">Login</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- ENCABEZADO -->
    <div class="hero">
        <div class="container">
            <h1>Iniciar Sesión</h1>
            <p class="lead">Portal Clase 1114</p>
        </div>
    </div>

    <!-- FORMULARIO -->
    <div class="container">
        <div class="row justify-content-center">

            <div class="col-md-6">

                <div class="card">
                    <div class="card-body">

                        <h3 class="mb-4 text-center">
                            Login
                        </h3>

                        {% if mensaje %}
                        <div class="alert alert-danger">
                            {{ mensaje }}
                        </div>
                        {% endif %}

                        <form method="POST">

                            <div class="mb-3">
                                <label class="form-label">Usuario</label>
                                <input type="text"
                                       class="form-control"
                                       name="usuario"
                                       required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Contraseña</label>
                                <input type="password"
                                       class="form-control"
                                       name="contraseña"
                                       required>
                            </div>

                            <button type="submit"
                                    class="btn btn-primary w-100">
                                Iniciar Sesión
                            </button>

                        </form>

                        <hr>

                        <p><strong>Profesor:</strong> henry / password123</p>
                        <p><strong>Estudiante:</strong> juan / 1234</p>

                    </div>
                </div>

            </div>

        </div>
    </div>

    <!-- FOOTER -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Portal Clase 1114 | Profesor: Henry Ortegon |  Angie Valentina Alape</p>
        </div>
    </footer>

</body>
</html>
